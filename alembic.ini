[alembic]
script_location = migrations
version_locations = migrations/versions
prepend_sys_path = .
sqlalchemy.url = postgresql+psycopg://postgres:adminforgemind@localhost:5432/forgemind_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.1s [%(name)s]: %(message)s
datefmt = %H:%M:%S
